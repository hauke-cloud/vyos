---
name: Bump VyOS

# Proposes the newest VyOS nightly as a pull request. The pull request's CI
# run builds the image from it and boots it, so a nightly that does not come
# up as a container never reaches main.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Find the newest nightly
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/vyos/vyos-nightly-build/releases/latest --jq .tag_name)"
          case "${latest}" in
            *-rolling) ;;
            *) echo "unexpected release tag: ${latest}" >&2; exit 1 ;;
          esac
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"
          echo "${latest}" > VYOS_VERSION

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/bump-vyos
          commit-message: "chore: Bump VyOS to ${{ steps.latest.outputs.version }}"
          title: "chore: Bump VyOS to ${{ steps.latest.outputs.version }}"
          body: |
            Updates the pinned VyOS nightly to `${{ steps.latest.outputs.version }}`.

            CI builds the image from the new ISO and runs the smoke test against it.
          labels: dependencies
